name: refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Restore upstream response cache
        id: upstream-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: upstream-cache-${{ github.run_id }}
          restore-keys: |
            upstream-cache-

      - name: Invalidate high-churn source cache on demand
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          rm -f cache/artificial_analysis_llms.json

      - name: Build CLI
        run: cargo build --release -p ipbr-rank-cli

      # Daily snapshot: the delta indicator compares against yesterday's
      # scoreboard, not the last ~10-min refresh. The cache restores the
      # previous daily snapshot; if today's snapshot already exists (i.e.
      # this is not the first run of the day), we skip overwriting it so
      # every run this hour shares the same baseline.
      - name: Fetch live scoreboard and manage daily snapshot
        id: prev-fetch
        continue-on-error: true
        run: |
          mkdir -p cache
          today="$(date -u +%Y-%m-%d)"
          live="cache/prev_scoreboard.toml"
          snapshot="cache/daily_snapshot_${today}.toml"
          prev_arg=""

          # Always fetch the current live scoreboard (may be used to
          # create today's snapshot).
          fetched=false
          if curl -fsS --max-time 10 \
              https://ipbr.pages.dev/scoreboard.toml \
              -o "$live"; then
            fetched=true
            echo "fetched live scoreboard ($(wc -c < "$live") bytes)"
          else
            rm -f "$live"
            echo "note: live scoreboard fetch failed"
          fi

          # If today's snapshot doesn't exist yet, create it from the
          # live scoreboard. This happens on the first successful run
          # of each day.
          if [[ ! -f "$snapshot" ]] && $fetched; then
            cp "$live" "$snapshot"
            echo "created daily snapshot for $today"
          fi

          # Find the most recent daily snapshot that is NOT today's.
          # That is yesterday's (or older) baseline for deltas.
          yesterday_snapshot="$(ls -t cache/daily_snapshot_*.toml 2>/dev/null \
            | grep -v "$today" | head -1)"
          if [[ -n "$yesterday_snapshot" ]]; then
            prev_arg="--prev $yesterday_snapshot"
            echo "using daily snapshot: $yesterday_snapshot"
          else
            echo "note: no prior-day snapshot found; deltas will be omitted this run"
          fi

          echo "prev_arg=$prev_arg" >> "$GITHUB_OUTPUT"

          # Prune snapshots older than 7 days.
          find cache -name 'daily_snapshot_*.toml' -mtime +7 -delete 2>/dev/null || true

      - name: Run pipeline
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./target/release/ipbr-rank --cache cache --out out all ${{ steps.prev-fetch.outputs.prev_arg }}

      - name: Save upstream response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: upstream-cache-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy out/site \
            --project-name=ipbr \
            --branch=main \
            --commit-dirty=true
