name: refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Restore upstream response cache
        id: upstream-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: upstream-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            upstream-cache-

      - name: Invalidate high-churn source cache on demand
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # Expire the response without deleting the fallback for an outage.
          if [[ -f cache/artificial_analysis_llms.json ]]; then
            touch -d '1970-01-01 UTC' cache/artificial_analysis_llms.json
          fi

      - name: Build CLI
        run: cargo build --locked --release -p ipbr-rank-cli

      # Rank-change chips compare against the scoreboard as it stood at the
      # start of last week, so the baseline is stable for a whole week rather
      # than shifting with every ~10-min refresh. The weekly snapshots ride
      # along in the restored `cache` directory; the script freezes this week's
      # snapshot on its first run and prunes weeks older than the baseline.
      - name: Resolve weekly rank-change baseline
        id: baseline
        continue-on-error: true
        run: |
          baseline="$(scripts/weekly_baseline.sh cache)"
          if [[ -n "$baseline" ]]; then
            echo "prev_arg=--prev $baseline" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./target/release/ipbr-rank --cache cache --out out all --best-effort ${{ steps.baseline.outputs.prev_arg }}

      - name: Report source health
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          scoreboard = pathlib.Path('out/scoreboard.toml')
          if scoreboard.exists():
              sources = tomllib.loads(scoreboard.read_text())['sources']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('| Source | Status | Rows | Matched |\n|---|---|---:|---:|\n')
                  for name, source in sorted(sources.items()):
                      summary.write(f"| {name} | {source['status']} | {source['n_rows_ingested']} | {source['n_rows_matched']} |\n")
          PY

      - name: Save upstream response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: upstream-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy out/site \
            --project-name=ipbr \
            --branch=main \
            --commit-dirty=true
