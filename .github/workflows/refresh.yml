name: refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Restore upstream response cache
        id: upstream-cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: upstream-cache-${{ github.run_id }}
          restore-keys: |
            upstream-cache-

      - name: Invalidate high-churn source cache on demand
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          rm -f cache/artificial_analysis_llms.json

      - name: Build CLI
        run: cargo build --release -p ipbr-rank-cli

      # Rank-change chips compare against the scoreboard as it stood at the
      # start of last week, so the baseline is stable for a whole week rather
      # than shifting with every ~10-min refresh. The weekly snapshots ride
      # along in the restored `cache` directory; the script freezes this week's
      # snapshot on its first run and prunes weeks older than the baseline.
      - name: Resolve weekly rank-change baseline
        id: baseline
        continue-on-error: true
        run: |
          baseline="$(scripts/weekly_baseline.sh cache)"
          if [[ -n "$baseline" ]]; then
            echo "prev_arg=--prev $baseline" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./target/release/ipbr-rank --cache cache --out out all ${{ steps.baseline.outputs.prev_arg }}

      - name: Save upstream response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: upstream-cache-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy out/site \
            --project-name=ipbr \
            --branch=main \
            --commit-dirty=true
