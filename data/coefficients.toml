# GDPval-AA measures real-world economic-value workflows across 44 knowledge-
# work occupations via blind pairwise comparison (Elo). Currently sourced
# only via overrides because AA's GDPval endpoint isn't exposed through the
# LLM-list API we already fetch.
[metrics.GDPval]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

# Toolathlon measures long-horizon tool-use across realistic applications.
# Values currently come from official release/model-card tables, so they are
# treated as override-reported rather than direct leaderboard measurements.
[metrics.Toolathlon]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

# OSWorld-Verified measures desktop/computer-use agent tasks. It is useful
# for planning and light BUILD evidence, but kept modestly weighted because
# harness/scaffold differences can matter more than pure model quality.
[metrics.OSWorldVerified]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

# BrowseComp is an agentic browsing/search benchmark. It broadens GEN and
# PLAN beyond static knowledge tests, but stays small because many rows are
# official-table reports rather than a single neutral live leaderboard.
[metrics.BrowseComp]
higher_better = true
log_scale = false
groups = ["GEN", "PLAN"]
transform = "percentile"

# Tool-assisted Humanity's Last Exam. Kept separate from GPQA_HLE_Reasoning,
# which blends AA's no-tools HLE/GPQA fields, so tool-use gains do not silently
# rewrite the no-tools reasoning axis.
[metrics.HLETools]
higher_better = true
log_scale = false
groups = ["GEN", "PLAN"]
transform = "percentile"

# Operational metrics use the `tail_penalty` transform: the top 80 % of
# the population maps into 70-100 (most models look "fast/cheap enough"
# at a glance), only the bottom 20 % drops sharply. Linear/percentile
# normalization made every spread between models matter equally, which
# over-rewarded the very fastest models and over-punished moderately slow
# ones. Users perceive operational speed/cost in tiers, not linearly.
[metrics.OutputSpeed]
higher_better = true
log_scale = true
groups = ["OPS_long", "OPS_precision", "OPS_review"]
transform = "tail_penalty"

[metrics.TTFT]
higher_better = false
log_scale = true
groups = ["OPS_long", "OPS_precision", "OPS_review"]
transform = "tail_penalty"

[metrics.BlendedCost]
higher_better = false
log_scale = true
groups = ["OPS_long", "OPS_precision", "OPS_review"]
transform = "tail_penalty"

[metrics.ContextWindow]
higher_better = true
log_scale = true
groups = ["OPS_long", "OPS_precision", "OPS_review"]
transform = "tail_penalty"
