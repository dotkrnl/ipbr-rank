# Reference-only operational metrics use the `tail_penalty` transform: the top 80 % of
# the population maps into 70-100 (most models look "fast enough"
# at a glance), only the bottom 20 % drops sharply. Linear/percentile
# normalization made every spread between models matter equally, which
# over-rewarded the very fastest models and over-punished moderately slow
# ones. These values remain visible diagnostics but have no final-score path.
[metrics.OutputSpeed]
family = "operations"
higher_better = true
log_scale = true
groups = ["OPS_long", "OPS_precision", "OPS_review"]
transform = "tail_penalty"

