# Coefficients for ipbr-rank scoring.
# This file is the authoritative source of truth; the CLI embeds it verbatim.

# Group weights only reference metrics we actually source. Earlier revisions
# carried NoveltyBench, EQWritingOrLongform, LiveBenchGeneral, NaturalPlan,
# PlanBench, TravelPlanner, JudgeBench, CodeJudgeBench, RewardBench2,
# CriticBench, LLMAggreFact — none of those have a public-leaderboard source
# we ingest, so they were permanently missing for every model and quietly
# dragged each group toward the 50-baseline shrink target. Better to be
# narrower and honest than wide and fake.

[group_weights.CRE]
LMArenaCreativeOrOpenEnded = 0.50
LMArenaText = 0.30
ARC_AGI_2 = 0.20

[group_weights.GEN]
ArtificialAnalysisIntelligence = 0.36
LMArenaText = 0.15
GPQA_HLE_Reasoning = 0.14
ARC_AGI_2 = 0.11
ArtificialAnalysisMath = 0.10
MMLUPro = 0.07
BrowseComp = 0.04
HLETools = 0.03

[group_weights.PLAN]
# PLAN composition reflects "structured multi-step decomposition" measured
# end-to-end. BFCL and TerminalBenchHard broaden tool-use / terminal-task
# coverage while keeping any single agent harness from dominating PLAN.
TerminalBench = 0.120
TerminalBench21 = 0.035
TerminalBenchHard = 0.060
BFCL = 0.060
HiLBench = 0.040
Toolathlon = 0.035
OSWorldVerified = 0.030
HLETools = 0.025
BrowseComp = 0.020
Tau2Bench = 0.145
ArtificialAnalysisReasoning = 0.160
IFBench = 0.100
LongContextRecall = 0.075
MCPAtlas = 0.095

# BUILD rebalanced around direct software-work evidence. SWEComposite remains
# the largest single input, but Scale SWE Atlas now carries a separate
# composite for codebase Q&A / test-writing / refactoring. BFCL and AA's
# TerminalBenchHard/AALiveCodeBench fields add live tool/terminal/coding
# coverage without giving any one harness a dominant coefficient. Live-coding
# signals are collapsed into LiveCodingComposite so four correlated coding
# benchmarks do not pile up as independent BUILD weights.
[group_weights.BUILD]
SWEComposite = 0.29
SWEAtlasComposite = 0.14
MCPAtlas = 0.060
TerminalBench = 0.045
TerminalBench21 = 0.025
TerminalBenchHard = 0.040
BFCL = 0.025
HiLBench = 0.015
Toolathlon = 0.015
OSWorldVerified = 0.010
GSO = 0.035
GDPval = 0.045
SonarComposite = 0.09
LongContextRecall = 0.025
LiveCodingComposite = 0.14

# Composite metrics — per-model weighted average of normalized input metrics.
# Treated as a single derived metric in scoring so several SWE-flavor sources
# don't pile up as independent weights.
#
# SWEComposite now favors SWE-Bench Pro and lets a model with direct
# Verified+Pro coverage clear the shrink transition. Verified remains
# useful for breadth, but Pro is the stronger live frontier signal because
# Verified is increasingly saturated/contaminated at the top end.
[effort_policy]
# Exceptions to the default scoring effort set
# (default | medium | thinking | high | max/xhigh). These are retained for
# product-tier aliases and any future explicitly blocked variants.

# Qwen "Max" is a product tier, not a reasoning-effort marker.
[[effort_policy.exceptions]]
effort = "max"
canonical_id = "qwen/qwen3.6-max-preview"

[[effort_policy.exceptions]]
effort = "max"
canonical_id = "qwen/qwen3.7-max"

# Historical MCP-Atlas carve-outs; high/max are globally scoreable now.
[[effort_policy.exceptions]]
effort = "max"
source = "mcp_atlas"
vendor = "anthropic"

[[effort_policy.exceptions]]
effort = "high"
source = "mcp_atlas"
vendor = "anthropic"

# Historical Artificial Analysis carve-outs; high is globally scoreable now.
[[effort_policy.exceptions]]
effort = "high"
source = "artificial_analysis"
canonical_id = "google/gemini-3-pro"

[[effort_policy.exceptions]]
effort = "high"
source = "artificial_analysis"
canonical_id = "google/gemini-3.5-flash"

[[effort_policy.exceptions]]
effort = "high"
source = "artificial_analysis"
canonical_id = "xai/grok-4.3"

[[effort_policy.exceptions]]
effort = "max"
source = "artificial_analysis"
canonical_id = "z-ai/glm-5.2"

[[effort_policy.exceptions]]
effort = "max"
source = "lmarena"
canonical_id = "z-ai/glm-5.2"

# Scale SWE Atlas harness submissions are benchmark observations.
[[effort_policy.exceptions]]
effort = "max"
source = "sweatlas_*"

[[effort_policy.exceptions]]
effort = "high"
source = "sweatlas_*"

[[effort_policy.exceptions]]
effort = "thinking"
source = "sweatlas_*"

[synthesis]
# Tightened to 0.50: more than half of a model's scored cells should not be
# borrowed from siblings. The 15 % conservative pull already softens synthetic
# values, but a stricter cap makes "synthesis_dominant" a meaningful warning
# flag and prevents frontier models from ranking highly on mostly inferred
# evidence. Terminal-Bench 2.1 / HiL-Bench narrow sources are still allowed to
# run under the 0.65 per-source cap.
per_model_cap = 0.50
# Several public sources have narrower coverage than the ranked model
# set. 0.65 prevents a single source from dominating through synthesis
# while still letting the curated frontier-model fills run.
per_source_cap = 0.65

[composite_metrics.SWEComposite]
# Rebalanced: Rebench↑0.15 (contamination-resistant rolling signal deserves more
# weight), Verified↓0.10 (saturated/contaminated at the frontier; shrinking it
# further reduces the influence of a benchmark where many frontier models cluster
# near the ceiling). Pro and Multilingual weights stay unchanged.
SWERebench = 0.45            # contamination-resistant rolling-window signal
SWEBenchVerified = 0.10      # widely reported, but saturated/contaminated
SWEBenchPro = 0.35           # hardest, multi-file (1.8k tasks, 4.1 files avg)
SWEBenchMultilingual = 0.10  # static, narrow scope, harder to game

# Scale SWE Atlas splits real software-engineering work into codebase Q&A,
# test writing, and refactoring. Keep the three correlated Scale signals as
# one BUILD input rather than stacking them independently.
[composite_metrics.SWEAtlasComposite]
SWEAtlasQnA = 0.30
SWEAtlasTestWriting = 0.30
SWEAtlasRefactoring = 0.40

# SonarComposite collapses Sonar's four submetrics (functional pass rate +
# three correlated density metrics) into one signal so that BUILD treats
# the whole Sonar payload as one source. Weights are kept proportional to
# the previous standalone weights (functional 0.04 / issue 0.025 / bug 0.02
# / vuln 0.015) → 0.40 / 0.25 / 0.20 / 0.15 within the composite.
[composite_metrics.SonarComposite]
SonarFunctionalSkill = 0.40
SonarIssueDensity = 0.25
SonarBugDensity = 0.20
SonarVulnerabilityDensity = 0.15

# LiveCodingComposite collapses the four live coding/reasoning signals into one
# BUILD input so they don't sit as four small independent weights. The weights
# are proportional to the previous standalone BUILD weights
# (ArtificialAnalysisCoding 0.04 / SciCode 0.04 / AALiveCodeBench 0.04 /
# CopilotArenaOrLMArenaCode 0.02) → 0.286 / 0.286 / 0.286 / 0.142.
[composite_metrics.LiveCodingComposite]
ArtificialAnalysisCoding = 0.286
SciCode = 0.286
AALiveCodeBench = 0.286
CopilotArenaOrLMArenaCode = 0.142

# LM_ARENA_REVIEW_PROXY is intentionally named as a proxy, not a judge
# benchmark. It combines LM Arena search and document preference ratings
# after each config is normalized on its own raw Elo scale. That is useful
# review-adjacent evidence, but not direct code-review capability, so the
# R-axis weights it lightly.
[group_weights.LM_ARENA_REVIEW_PROXY]
LMArenaSearch = 0.50
LMArenaDocument = 0.50

[group_weights.OPS_long]
OutputSpeed = 0.55
TTFT = 0.20
BlendedCost = 0.10
ContextWindow = 0.15

[group_weights.OPS_precision]
OutputSpeed = 0.30
TTFT = 0.35
BlendedCost = 0.20
ContextWindow = 0.15

[group_weights.OPS_review]
# Reviewing big PRs is the most context-hungry of the four roles, yet
# OPS_review previously weighted ContextWindow lower than OPS_long does.
# TTFT was also overweighted at 0.40 — reviewers care more that the full
# judgment lands than that the first token does. Rebalanced 2026-04 after
# multi-agent review: OutputSpeed up, TTFT down, ContextWindow up.
OutputSpeed = 0.30
TTFT = 0.25
BlendedCost = 0.20
ContextWindow = 0.25

# Role weights — capability scores. AISL was removed from active scoring
# after local reproduction showed the benchmark surface was not
# representative enough of real model quality and was too noise-prone.
# Its former 0.15 slot is redistributed into the non-operational public
# benchmark groups for each role; OPS remains fixed at 0.08.
#
# Operational metrics (speed/cost/context/TTFT) carry weight 0.08, up from
# the earlier 0.03. The tail-penalty curve in OPS_* (top 80 % of the
# population maps to 70..100, bottom 20 % to 0..70) means models in the
# "fast enough" tier still cluster within a 2-point spread of each other
# in the role score — the small-penalty regime the previous 0.03 weight
# was trying to express. Models in the *bottom* 20 % drop sharply: at
# weight 0.08 a model on the slowest tail loses ~5 points relative to
# the fast cluster, which finally makes "utterly slow" actually hurt
# without warping rankings between models that are merely "average fast"
# vs "very fast." Use the OPS_* groups directly for a pure speed/cost
# view of the population.
[final_score_weights.I_raw]
# Idea generation is the least operationally sensitive role. Reduce the OPS
# weight so creativity and general intelligence dominate the role score; the
# GEN increase offsets the OPS decrease exactly.
CRE = 0.62
GEN = 0.33
OPS_long = 0.05

[final_score_weights.P_raw]
PLAN = 0.55
GEN = 0.37
OPS_precision = 0.08

[final_score_weights.B_raw]
BUILD = 0.84
PLAN = 0.08
OPS_precision = 0.08

[final_score_weights.R]
LM_ARENA_REVIEW_PROXY = 0.25
BUILD = 0.29
PLAN = 0.38
OPS_review = 0.08

[aggregation]
# Coverage threshold around which we transition from shrink-to-50 to
# trusting the present-weight mean directly. Raised to 0.75 with a narrower
# 0.10 band so models need fuller evidence before the missing-weight shrink is
# removed; the smoother transition still avoids a discontinuous cliff.
trust_threshold = 0.75
# The width of the smooth-step transition band (centered on trust_threshold).
# 0.10 means the transition occurs over [0.70, 0.80].
trust_transition_width = 0.10

[penalties]
# Conservative discount applied to per-metric values that came in via
# cross-vendor/cross-series or older-target-from-newer-donor synthesis
# rather than a direct measurement. Same-series forward fills declared in
# data/synthesis_aliases.toml use zero synthesis penalty.
synthesis = 0.15
# Manual overrides are public but hand-curated. Making them slightly
# softer than a directly ingested leaderboard row (10% pull toward 50).
override_reported = 0.10

[metrics.LMArenaText]
higher_better = true
log_scale = false
groups = ["CRE", "GEN"]
transform = "percentile"

[metrics.LMArenaCreativeOrOpenEnded]
higher_better = true
log_scale = false
groups = ["CRE"]
transform = "percentile"

[metrics.CopilotArenaOrLMArenaCode]
# Input to LiveCodingComposite; no longer a direct BUILD weight.
higher_better = true
log_scale = false
groups = []
transform = "percentile"

[metrics.LMArenaSearch]
higher_better = true
log_scale = false
groups = ["LM_ARENA_REVIEW_PROXY"]
transform = "percentile"

[metrics.LMArenaDocument]
higher_better = true
log_scale = false
groups = ["LM_ARENA_REVIEW_PROXY"]
transform = "percentile"

# All benchmark metrics use percentile normalization so they're on a
# common scale before being averaged. Raw scores reflect each benchmark's
# difficulty calibration (e.g. SWE-bench Verified saturates near 90% while
# Rebench caps out around 65%), so a passthrough scoring would systematically
# discount harder benchmarks. After percentile normalization, "top of
# leaderboard X" maps to ~100 across all benchmarks, regardless of headline
# difficulty.
[metrics.ArtificialAnalysisIntelligence]
higher_better = true
log_scale = false
groups = ["GEN"]
transform = "percentile"

[metrics.ArtificialAnalysisCoding]
# Input to LiveCodingComposite; no longer a direct BUILD weight.
higher_better = true
log_scale = false
groups = []
transform = "percentile"

[metrics.ArtificialAnalysisReasoning]
higher_better = true
log_scale = false
groups = ["PLAN"]
transform = "percentile"

[metrics.LiveCodeBench]
# Retained as an ingested metric for backwards-compat with the cached
# fixture and any consumers reading per-source values, but removed from
# group_weights.BUILD (see comment there). The upstream JSON has been
# frozen at mid-2025 frontier for ~12 months; GSO is the active
# replacement track. `groups = []` keeps it descriptively unscored.
higher_better = true
log_scale = false
groups = []
transform = "percentile"

# GSO ("Generalized Software Optimization") replaces LiveCodeBench in the
# BUILD portfolio. We ingest the `score_hack_control` field — GSO's
# contamination-resistant variant, added specifically to penalize
# deceptive optimizations — rather than raw `score`. Filtered to the
# `Opt@1` setting; among Opt@1 rows for the same model we keep the one
# with the highest reasoning_effort (max/xhigh before high before default).
[metrics.GSO]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

[metrics.GPQA_HLE_Reasoning]
higher_better = true
log_scale = false
groups = ["GEN"]
transform = "percentile"

# SWE-flavor metrics use percentile normalization so they enter the
# SWEComposite on a comparable scale. Raw scores reflect benchmark difficulty
# (Rebench tasks are harder than Verified by ~25% systematically), so
# arithmetically combining raw percentages would unfairly discount models
# with Rebench coverage. After percentile normalization, "top of Rebench"
# and "top of Verified" both map to ~100 within their own populations.
[metrics.SWEBenchVerified]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

[metrics.TerminalBench]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

# Terminal-Bench 2.1 is a smaller but newer official Terminal-Bench track,
# covering current agent/model combinations such as GPT-5.5, Opus 4.8,
# Gemini 3.1 Pro, Claude Opus 4.7, and GLM-5.1.
[metrics.TerminalBench21]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

[metrics.TerminalBenchHard]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

[metrics.BFCL]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

# HiL-Bench measures selective escalation: recognizing under-specified,
# ambiguous, or contradictory tasks and asking targeted human questions via
# `ask_human()` instead of guessing. It is primarily PLAN evidence with a
# small BUILD contribution because successful escalation is needed to finish
# blocked SWE tasks.
[metrics.HiLBench]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

[metrics.SWEBenchMultilingual]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

[metrics.SWERebench]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

# Scale's harder, multi-file SWE-Bench. Frontier scores 50-65% (vs Verified
# saturating near 90), so it differentiates better at the top.
[metrics.SWEBenchPro]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

[metrics.SWEAtlasQnA]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

[metrics.SWEAtlasTestWriting]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

[metrics.SWEAtlasRefactoring]
higher_better = true
log_scale = false
groups = ["BUILD"]
transform = "percentile"

# MCP-Atlas — Scale's tool-orchestration leaderboard over 36 real MCP servers.
# Feeds PLAN (planning multi-step tool sequences) and BUILD (real coding-agent
# loops are tool-orchestration loops).
[metrics.MCPAtlas]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
transform = "percentile"

# Kimi K2.7 Code launch-card auxiliary metrics. These are useful reported
# measurements, but not yet part of role scoring: some are Moonshot-internal
# harnesses and the public third-party boards are not yet ingested here.
# `groups = []` keeps them descriptively available without changing weights.
[metrics.KimiCodeBenchV2]
higher_better = true
log_scale = false
groups = []
transform = "percentile"

[metrics.ProgramBench]
higher_better = true
log_scale = false
groups = []
transform = "percentile"

[metrics.MLSBenchLite]
higher_better = true
log_scale = false
groups = []
