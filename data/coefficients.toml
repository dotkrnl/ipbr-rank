[metrics.KimiClaw247Bench]
higher_better = true
log_scale = false
groups = []
transform = "percentile"

[metrics.MCPMarkVerified]
higher_better = true
log_scale = false
groups = []
transform = "percentile"

# ARC-AGI v2 (semi-private track) — pure novel-pattern induction.
# Orthogonal to GPQA/HLE which test learned knowledge.
[metrics.ARC_AGI_2]
