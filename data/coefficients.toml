log_scale = false
groups = ["GEN"]
transform = "percentile"

[metrics.MMLUPro]
higher_better = true
log_scale = false
groups = ["GEN"]
transform = "percentile"

[metrics.LongContextRecall]
higher_better = true
log_scale = false
groups = ["PLAN", "BUILD"]
