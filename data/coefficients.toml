# Coefficients for ipbr-rank scoring.
# This file is the authoritative source of truth; the CLI embeds it verbatim.

# These derived metrics select the highest-priority available input instead of
# averaging duplicate observations of the same benchmark. Input weights encode
# precedence, not statistical mass.
precedence_composites = ["TerminalBench21Composite"]

# Group weights only reference metrics we actually source. Earlier revisions
# carried NoveltyBench, EQWritingOrLongform, LiveBenchGeneral, NaturalPlan,
# PlanBench, TravelPlanner, JudgeBench, CodeJudgeBench, RewardBench2,
# CriticBench, LLMAggreFact — none of those have a public-leaderboard source
# we ingest, so they were permanently missing for every model and quietly
# dragged each group toward the 50-baseline shrink target. Better to be
# narrower and honest than wide and fake.

[group_weights.CRE]
# EQ-Bench Creative Writing v3 is the most direct creativity signal but has
# not scored roughly half the current cohort, and ARC (novelty) is similarly
# sparse. LM Arena's Creative Writing category Elo is broadly covered, so it
# carries a real creativity input for models the specialist boards miss, while
# LM Arena Text stays a general preference/breadth input. The two LM Arena
# leaves share the `lmarena` family, so the 30% family cap keeps the platform
# from dominating the Idea role.
EQBenchCreativeWriting = 0.40
LMArenaCreative = 0.25
ARC_AGI_2 = 0.20
LMArenaText = 0.15

[group_weights.GEN]
# Aggregate indices and their component evaluations must not both count.
# BrowseComp and HLETools remain diagnostics until a neutral direct feed exists.
LMArenaText = 0.35
ARC_AGI_2 = 0.30
AAGeneralComposite = 0.35

[group_weights.PLAN]
# PLAN emphasizes current end-to-end agent and tool-use evidence while retaining
# independent context and enterprise-work signals. HiL-Bench is a small
# supplemental planning input because knowing when to escalate is useful but
# specialized. BFCL remains ingested as a diagnostic: its narrow, overlapping
# cohort no longer affects the primary rank. Terminal-Bench 2.0 is superseded
# by 2.1; the manually curated Toolathlon/OSWorld/HLETools/BrowseComp and
# construct-mismatched ARC paths likewise remain diagnostic.
MCPAtlas = 0.30
Tau3Banking = 0.20
LongContextComposite = 0.15
GDPvalAA2 = 0.10
EnterpriseWorkflowComposite = 0.10
TerminalBench21Composite = 0.10
HiLBench = 0.05

# BUILD is centered on direct software-work evidence. SWEComposite remains the
# largest input; live coding, MCP orchestration, SWE Atlas, terminal work,
# DeepSWE, and long-context retrieval cover distinct implementation demands.
# BFCL, HiL-Bench, GSO, and Sonar remain ingested diagnostics: BFCL overlaps
# other tool-use signals, HiL-Bench is planning-specific, GSO has unresolved
# reproducibility concerns, and Sonar measures a narrower coding-quality
# profile with mixed explicit effort levels.
[group_weights.BUILD]
SWEComposite = 0.35
LiveCodingComposite = 0.20
MCPAtlas = 0.15
SWEAtlasComposite = 0.10
TerminalBench21Composite = 0.080
DeepSWE = 0.07
LongContextComposite = 0.05

# Composite metrics — per-model weighted average of normalized input metrics.
# Treated as a single derived metric in scoring so several SWE-flavor sources
# don't pile up as independent weights.
#
# Active composites and precedence fallbacks are defined below.
[effort_policy]
# Exceptions to the default scoring effort set
# (default | medium | thinking | high | xhigh | max). These are retained for
# product-tier aliases and any future explicitly blocked variants.

# Qwen "Max" is a product tier, not a reasoning-effort marker.
[[effort_policy.exceptions]]
effort = "max"
canonical_id = "qwen/qwen3.6-max-preview"

[[effort_policy.exceptions]]
effort = "max"
canonical_id = "qwen/qwen3.7-max"

# Historical MCP-Atlas carve-outs; high/max are globally scoreable now.
[[effort_policy.exceptions]]
effort = "max"
source = "mcp_atlas"
vendor = "anthropic"

[[effort_policy.exceptions]]
effort = "high"
source = "mcp_atlas"
vendor = "anthropic"

# Historical Artificial Analysis carve-outs; high is globally scoreable now.
[[effort_policy.exceptions]]
effort = "high"
source = "artificial_analysis"
canonical_id = "google/gemini-3-pro-preview"

[[effort_policy.exceptions]]
effort = "high"
source = "artificial_analysis"
canonical_id = "google/gemini-3.5-flash"

[[effort_policy.exceptions]]
effort = "high"
source = "artificial_analysis"
canonical_id = "xai/grok-4.3"

[[effort_policy.exceptions]]
effort = "max"
source = "artificial_analysis"
canonical_id = "z-ai/glm-5.2"

[[effort_policy.exceptions]]
effort = "max"
source = "lmarena"
canonical_id = "z-ai/glm-5.2"

# Scale SWE Atlas harness submissions are benchmark observations.
[[effort_policy.exceptions]]
effort = "max"
source = "sweatlas_*"

[[effort_policy.exceptions]]
effort = "high"
source = "sweatlas_*"

[[effort_policy.exceptions]]
effort = "thinking"
source = "sweatlas_*"

[composite_metrics.SWEComposite]
# SWE-bench Verified is retained as a diagnostic but retired from the primary
# rank because it is static, saturated at the frontier, and redundant with the
# harder tracks. SWE-Rebench rows are admitted only for post-release windows.
SWERebench = 0.45
SWEBenchPro = 0.45
SWEBenchMultilingual = 0.10

# Scale SWE Atlas splits real software-engineering work into codebase Q&A,
# test writing, and refactoring. Keep the three correlated Scale signals as
# one BUILD input rather than stacking them independently.
[composite_metrics.SWEAtlasComposite]
SWEAtlasQnA = 0.30
SWEAtlasTestWriting = 0.30
SWEAtlasRefactoring = 0.40

# Diagnostic-only composite retained for inspecting functional pass rate and
# issue density. It has no final role path.
[composite_metrics.SonarComposite]
SonarFunctionalSkill = 0.60
SonarIssueDensity = 0.40

# LiveCodingComposite combines the current, broadly covered coding signals.
[composite_metrics.LiveCodingComposite]
SciCode = 0.60
CopilotArenaOrLMArenaCode = 0.40

# Legacy two-leaf AA composite retained for historical consumers only. The
# primary GEN path uses AAGeneralComposite below.
[composite_metrics.AAReasoningComposite]
# AIME 2025 and MMLU-Pro remain visible diagnostics, but AA retired them from
# its current Intelligence Index. The primary reasoning composite uses the two
# current, broadly covered leaves.
GPQA = 0.50
HLE = 0.50

# Current AA v4.1 general/scientific evidence. The weights preserve AA's
# relative 12/6/6/8/4 allocation after moving AA-LCR exclusively into the
# dedicated long-context composite, so the same observation cannot enter a
# role twice.
[composite_metrics.AAGeneralComposite]
HLE = 0.3333333333333333
GPQA = 0.16666666666666666
CritPt = 0.16666666666666666
AAOmniscienceAccuracy = 0.2222222222222222
AAOmniscienceNonHallucination = 0.1111111111111111

# Legacy tau2-era composite retained for historical consumers only. It has no
# path into the primary PLAN score.
[composite_metrics.TauComposite]
Tau2Bench = 0.75
TauBanking = 0.25

# AA kept the `tau_banking` API key after upgrading its public suite. The
# current tau3 score is used directly; the retired tau2 blend above remains
# diagnostic for historical consumers only.

# Two independent long-context implementations corroborate the same construct
# without creating separate role weight. AA-LCR remains the anchor because it
# has broader tracked-model coverage; MRCRv2 adds current multi-needle stress.
[composite_metrics.LongContextComposite]
LongContextRecall = 0.60
ContextArenaMRCR128k = 0.40

# Stateful enterprise workflow evaluations share an AA/Stirrup execution
# contour and are therefore collapsed into one PLAN leaf.
[composite_metrics.EnterpriseWorkflowComposite]
EnterpriseOpsGymAA = 0.65
AutomationBenchAA = 0.35

# The weights encode precedence: official Terminal-Bench 2.1 is preferred and
# AA's observation is a coverage fallback. They are never averaged together.
[composite_metrics.TerminalBench21Composite]
TerminalBench21 = 0.55
AATerminalBench21 = 0.45

# BFCLComposite keeps Berkeley's overall V4 accuracy as a single leaf. The
# published category splits remain visible diagnostics and are not stacked
# with the overall score from which they are derived.
[composite_metrics.BFCLComposite]
BFCL = 1.0

# LM_ARENA_REVIEW_PROXY is intentionally named as a proxy, not a judge
# benchmark. It combines LM Arena search and document preference ratings
# after each config is normalized on its own raw Elo scale. That is useful
# review-adjacent evidence, but not direct code-review capability.
[group_weights.LM_ARENA_REVIEW_PROXY]
LMArenaSearch = 0.50
LMArenaDocument = 0.50

[group_weights.REVIEW_DIRECT]
# Diagnostic-only Judgemark group. Judge discrimination is not code review, so
# REVIEW_DIRECT is deliberately unreachable from final_score_weights.R.
EQBenchJudgemark = 1.0

# CODE_REVIEW_DIRECT is the first genuinely direct code-review signal in the
# portfolio: Factory's benchmark scores models on 50 real pull requests with
# human-curated bug sets and a cross-validated semantic judge. Its cohort is
# small and fixed at one effort, so the F1 leaf is supplemental for
# eligibility — it moves the Review score where present without making
# unmeasured models provisional. It reaches R directly (unlike REVIEW_DIRECT).
[group_weights.CODE_REVIEW_DIRECT]
FactoryCodeReviewF1 = 1.0

# Reference-only operational views. They are rendered as diagnostics but are
# unreachable from every final_score_weights role and from balanced ranking.
[group_weights.OPS_long]
OutputSpeed = 0.61
TTFT = 0.22
ContextWindow = 0.17

[group_weights.OPS_precision]
OutputSpeed = 0.375
TTFT = 0.4375
ContextWindow = 0.1875

[group_weights.OPS_review]
OutputSpeed = 0.375
TTFT = 0.3125
ContextWindow = 0.3125

# Role weights are capability-only. Price, throughput, latency, and advertised
# context have no path into these tables and therefore exactly zero rank weight.
[final_score_weights.I_raw]
# Capability only. Operational and pricing metrics remain visible diagnostics
# but do not affect any rank.
CRE = 0.65
GEN = 0.35

[final_score_weights.P_raw]
PLAN = 0.65
GEN = 0.35

[final_score_weights.B_raw]
BUILD = 0.95
PLAN = 0.05

[final_score_weights.R]
# Review now leads with a direct code-review signal where it exists, backed by
# the search/document preference proxy and implementation/planning evidence.
# Judgemark remains a diagnostic with no ranking path. Where a model has no
# Factory code-review observation, the CODE_REVIEW_DIRECT weight redistributes
# across the remaining observed evidence, so unmeasured models are unaffected.
CODE_REVIEW_DIRECT = 0.20
LM_ARENA_REVIEW_PROXY = 0.20
BUILD = 0.30
PLAN = 0.30

[aggregation]
# Presentation-only threshold for the legacy `groups_shrunk` diagnostic.
# Methodology-v3 capability uses available same-product evidence; it never switches
# behavior at this threshold.
trust_threshold = 0.75
trust_transition_width = 0.10

[evidence]
# Ranking v3 separates score from evidence quality. Every actual same-product
# observation has full direct reliability, including cited manual overrides.
# No single correlated source/benchmark family may exceed 30% of role leaf
# weight.
prior_score = 50.0
direct_reliability = 1.0
provisional_min_direct = 0.60
provisional_min_families = 3
provisional_breadth_min_direct = 0.35
provisional_breadth_min_families = 5
# Total-coverage paths must also establish a representative core base. This
# prevents a favorable collection of specialist/supplemental results from
# qualifying an otherwise sparsely measured model.
representative_min_core_direct = 0.35
representative_min_core_families = 3
# Four independent core families at 50% direct coverage are also sufficient.
# This path is core-only so sparse supplemental evidence cannot qualify a new
# model merely by accumulating narrow leaderboards.
core_corroborated_min_direct = 0.50
core_corroborated_min_families = 4
# Historical support is a qualification path, never a scoring input. It needs
# a meaningful current base plus breadth across independent retired sources.
historical_min_current_direct = 0.25
historical_min_current_families = 2
historical_min_families = 2
historical_min_total_families = 5
# Balanced requires three independently ranked roles; the fourth must retain
# at least this much direct current score-path evidence.
balanced_min_fourth_direct = 0.20
max_family_weight = 0.30

[normalization]
# v2 freezes each ranked metric's raw-unit scale to the refreshed 2026-07-12
# cohort. Anchors are the direct-evidence p5/p95 values where at least two
# distinct same-product observations existed; manually curated observations were
# included where native feeds had gaps. Future cohorts do not move these
# anchors.
anchor_version = "2026-07-12.v2"
snapshot_date = "2026-07-12"
derivation = "direct_p05_p95"
low_quantile = 0.05
high_quantile = 0.95

